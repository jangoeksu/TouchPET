<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TouchPET · Blob Kitty Preview</title><style>body{background:#edf1f5;color:#293444;font:15px system-ui;text-align:center;padding:30px}canvas{width:min(100%,1000px);height:auto;border-radius:20px;box-shadow:0 14px 45px #8b9aaa66;touch-action:none}button{border:0;border-radius:14px;background:#ffd8e7;padding:12px 22px;cursor:pointer}p{opacity:.75}</style><h2>🐱 TouchPET · Blob Kitty</h2><canvas id="scene" width="900" height="210"></canvas><p>Drag and release the pink ball to roll it. Click Kitty to pet her. Click the grass to give her a snack.</p><button id="pet">♡ Pet Kitty</button><script>

if(!S.drag){S.ball+=S.v*dt;S.spin+=S.v*dt/11;S.v*=Math.exp(-1.45*dt);if(S.ball<18||S.ball>882){S.ball=clamp(S.ball,18,882);S.v*=-.55}if(Math.abs(S.v)<2)S.v=0}

requestAnimationFrame(draw);const pos=e=>(e.clientX-c.getBoundingClientRect().left)/c.getBoundingClientRect().width*900;let lastX=0,lastT=0;c.addEventListener('pointerdown',e=>{let x=pos(e);c.setPointerCapture(e.pointerId);if(Math.abs(x-S.ball)<28){S.drag=true;S.v=0;lastX=x;lastT=performance.now()}else if(Math.abs(x-S.x)<43){S.pet=1;S.lastWander=performance.now()}else{S.food=x;S.lastWander=performance.now()}});c.addEventListener('pointermove',e=>{if(!S.drag)return;let x=pos(e),t=performance.now();S.v=clamp((x-lastX)/Math.max(.016,(t-lastT)/1000),-700,700);S.ball=clamp(x,18,882);lastX=x;lastT=t});function release(){if(S.drag){S.drag=false;S.chase=true}}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);document.querySelector('#pet').onclick=()=>{S.pet=1;S.lastWander=performance.now()};
