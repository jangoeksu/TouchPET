<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TouchBarPET · Blob Kitty Preview</title><style>*{box-sizing:border-box}body{background:#0b0b0b;color:#f4f4f4;font:15px -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;text-align:center;max-width:1120px;margin:0 auto;padding:70px 24px;letter-spacing:.015em}canvas{width:min(100%,1000px);height:auto;border-radius:12px;border:1px solid #353535;box-shadow:0 24px 75px #0009;touch-action:none;filter:none}button{border:1px solid #777;border-radius:6px;background:#f4f4f4;color:#111;padding:13px 28px;cursor:pointer;font-weight:600}button:hover{background:#ccc}p{opacity:.65;line-height:1.7}h2{font-weight:500;font-size:30px;letter-spacing:.12em;margin:0 0 35px}#needs{padding:20px;letter-spacing:.09em;color:#dedede}</style><h2>TouchBarPET · Blob Kitty</h2><canvas id="scene" width="900" height="210"></canvas><div id="needs" style="display:flex;justify-content:center;gap:30px;margin:12px;font-weight:600"><span id="hunger">Hunger: 10/10</span><span id="company">Company: 10/10</span></div><p>Drag and release the pink ball to roll it. Click Kitty to pet her. Click the grass to give her a snack.</p><button id="pet">Pet Kitty</button><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),S={x:350,ball:660,v:0,spin:0,drag:false,chase:false,lounge:false,loungeUntil:0,nextLounge:performance.now()+12000,food:null,dir:1,steps:0,blink:0,pet:0,walkTo:350,last:performance.now(),lastWander:0,hunger:10,company:10};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function oval(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}function line(color,w,pts){g.strokeStyle=color;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(...pts[0]);for(const p of pts.slice(1))g.lineTo(...p);g.stroke()}function draw(t){const dt=Math.min(.05,(t-S.last)/1000);S.last=t;S.hunger=Math.max(0,S.hunger-dt/18);S.company=Math.max(0,S.company-dt/22);document.getElementById('hunger').textContent='Hunger: '+Math.round(S.hunger)+'/10';document.getElementById('company').textContent='Company: '+Math.round(S.company)+'/10';const sky=g.createLinearGradient(0,0,0,170);sky.addColorStop(0,'#399df8');sky.addColorStop(1,'#96d7ff');g.fillStyle=sky;g.fillRect(0,0,900,210);for(let i=0;i<3;i++){let x=((i*340+t*.002)%1100)-80,y=30+(i%2)*20;oval(x,y,46,10,'#f4fbff88');oval(x+15,y-4,27,11,'#f4fbff88')}g.fillStyle='#a1cbb8';g.fillRect(0,199,900,11);
if(!S.drag){S.ball+=S.v*dt;S.spin+=S.v*dt/11;S.v*=Math.exp(-1.45*dt);if(S.ball<18||S.ball>882){S.ball=clamp(S.ball,18,882);S.v*=-.55}if(Math.abs(S.v)<2)S.v=0}
if(S.lounge&&t>S.loungeUntil){S.lounge=false;S.nextLounge=t+14000+Math.random()*10000}if(S.food!==null){S.lounge=false;S.walkTo=S.food}else if(S.chase){S.lounge=false;S.walkTo=S.ball}else if(!S.lounge&&t>S.nextLounge){S.lounge=true;S.loungeUntil=t+3000+Math.random()*3000;S.walkTo=S.x}else if(!S.lounge&&t-S.lastWander>6000){S.walkTo=100+Math.random()*700;S.lastWander=t}const d=S.walkTo-S.x;if(Math.abs(d)>6){S.dir=Math.sign(d);S.x+=clamp(d,-26*dt,26*dt);S.steps+=dt*12}else if(S.food!==null){S.food=null;S.hunger=Math.min(10,S.hunger+4)}else if(S.chase&&!S.drag){S.v+=S.dir*65;S.chase=false}S.x=clamp(S.x,30,870);
if(S.food!==null){oval(S.food,193,7,4,'#e8a057');oval(S.food-4,191,3,3,'#f8ca8d')}
oval(S.ball,193,12,12,'#e78db7');
const walking=Math.abs(d)>6&&!S.lounge,step=walking?Math.sin(S.steps)*2:0,breath=Math.sin(t*.002)*.7;g.save();g.translate(S.x,190+breath);g.scale(S.dir*1.17,1.17);
const cocoa='#cda786',cream='#fff7e8',pink='#ffabb8',blue='#2b94f9',deep='#12478d',ink='#62454c';
oval(0,5,34,5,'#315b6630');

  line(cocoa,8,[[23,-12],[39,-20],[34,-35]]);
  oval(0,-18,37,25,cocoa);oval(0,-17,26,18,cream);
  // Pointed ears even when she rolls belly-up.

  g.beginPath();g.moveTo(-25,-34);g.lineTo(-22,-56);g.lineTo(-10,-39);g.closePath();g.fill();
  g.beginPath();g.moveTo(25,-34);g.lineTo(22,-56);g.lineTo(10,-39);g.closePath();g.fill();
  oval(-23,-39,5,5,pink);oval(23,-39,5,5,pink);
  oval(-23,-37+Math.sin(t*.003)*1.5,10,9,cocoa);
  oval(23,-37-Math.sin(t*.003)*1.5,10,9,cocoa);
  oval(-15,-27,7,6,blue);oval(15,-27,7,6,blue);
  oval(-17,-29,2.6,2.7,'white');oval(13,-29,2.6,2.7,'white');
  oval(-9,-15,11,6,cream);oval(9,-15,11,6,cream);
  g.fillStyle=pink;g.beginPath();g.moveTo(-4,-20);g.lineTo(4,-20);g.lineTo(0,-16);g.closePath();g.fill();

}else{
  // Distinct cat silhouette: high triangular ears, tiny paws, fluffy tail.
  line(cocoa,9,[[23,-17],[39,-19],[42,-32],[36,-42]]);

  g.beginPath();g.moveTo(24,-50);g.lineTo(21,-64);g.lineTo(15,-51);g.closePath();g.fill();

g.restore();if(S.pet>0){g.font='18px system-ui';g.fillText('+',S.x-7,90-S.pet*10);S.pet=Math.max(0,S.pet-dt*1.5)}requestAnimationFrame(draw)}
requestAnimationFrame(draw);const pos=e=>(e.clientX-c.getBoundingClientRect().left)/c.getBoundingClientRect().width*900;let lastX=0,lastT=0;c.addEventListener('pointerdown',e=>{let x=pos(e);c.setPointerCapture(e.pointerId);if(Math.abs(x-S.ball)<23){S.drag=true;S.lounge=false;S.v=0;lastX=x;lastT=performance.now()}else if(Math.abs(x-S.x)<58){S.pet=1;S.company=Math.min(10,S.company+2);S.lounge=false;S.nextLounge=performance.now()+12000;S.lastWander=performance.now()}else{S.food=x;S.lounge=false;S.lastWander=performance.now()}});c.addEventListener('pointermove',e=>{if(!S.drag)return;let x=pos(e),t=performance.now();S.v=clamp((x-lastX)/Math.max(.016,(t-lastT)/1000),-155,155);S.ball=clamp(x,18,882);lastX=x;lastT=t});function release(){if(S.drag){S.drag=false;S.chase=true}}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);document.querySelector('#pet').onclick=()=>{S.pet=1;S.company=Math.min(10,S.company+2);S.lounge=false;S.nextLounge=performance.now()+12000;S.lastWander=performance.now()};
</script></html>
