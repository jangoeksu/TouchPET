name: macOS build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Build TouchPET
        run: bash ./build.sh
      - name: Package TouchPET.app
        run: ditto -c -k --sequesterRsrc --keepParent dist/TouchPET.app TouchPET-macOS.zip
      - name: Upload downloadable app
        uses: actions/upload-artifact@v6
        with:
          name: TouchPET-macOS
          path: TouchPET-macOS.zip
          retention-days: 14
