name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Build TouchBarPET
        run: bash ./build.sh
      - name: Package TouchBarPET.app
        run: ditto -c -k --sequesterRsrc --keepParent dist/TouchBarPET.app TouchBarPET-macOS.zip
      - name: Upload downloadable app
        uses: actions/upload-artifact@v6
        with:
          name: TouchBarPET-macOS
          path: TouchBarPET-macOS.zip
          retention-days: 14
