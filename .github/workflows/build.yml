name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Test pet needs persistence
        run: |\n          mkdir -p /tmp/touchbarpet-tests\n          cp Tests/PetNeedsTests.swift /tmp/touchbarpet-tests/main.swift\n          swiftc Sources/PetNeeds.swift /tmp/touchbarpet-tests/main.swift -o /tmp/touchbarpet-tests/run-tests\n          /tmp/touchbarpet-tests/run-tests
      - name: Check shell scripts
        run: bash -n build.sh install.sh uninstall.sh
      - name: Build TouchBarPET
        run: bash ./build.sh
      - name: Package TouchBarPET.app
        run: ditto -c -k --sequesterRsrc --keepParent dist/TouchBarPET.app TouchBarPET-macOS.zip
      - name: Upload downloadable app
        uses: actions/upload-artifact@v6
        with:
          name: TouchBarPET-macOS
          path: TouchBarPET-macOS.zip
          retention-days: 14
